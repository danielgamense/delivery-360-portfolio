<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc">
<title id="title">Delivery 360, financeiro e conciliação</title><desc id="desc">Painel demonstrativo de recebimentos, taxas, margem e fluxo de caixa.</desc>
<rect width="1100" height="610" rx="26" fill="#fff" stroke="#dfe9ea" stroke-width="2"/><text x="48" y="58" font-family="Arial" font-size="25" font-weight="700" fill="#123b47">Financeiro e conciliação</text><text x="48" y="84" font-family="Arial" font-size="13" fill="#66818a">Separe venda, recebimento, taxas e resultado para enxergar o caixa.</text>
<g font-family="Arial"><rect x="48" y="120" width="310" height="115" rx="16" fill="#eef6f7"/><text x="76" y="158" font-size="13" fill="#66818a">Vendas registradas</text><text x="76" y="202" font-size="31" font-weight="700" fill="#123b47">R$ 84,6 mil</text><rect x="380" y="120" width="310" height="115" rx="16" fill="#f0f8f0"/><text x="408" y="158" font-size="13" fill="#66818a">Recebimentos conciliados</text><text x="408" y="202" font-size="31" font-weight="700" fill="#267450">R$ 81,9 mil</text><rect x="712" y="120" width="340" height="115" rx="16" fill="#fff7ee"/><text x="740" y="158" font-size="13" fill="#66818a">Taxas e divergências</text><text x="740" y="202" font-size="31" font-weight="700" fill="#c56e33">R$ 2,7 mil</text><rect x="48" y="270" width="620" height="270" rx="16" fill="#f8fafb"/><text x="78" y="310" font-size="17" font-weight="700" fill="#123b47">Fluxo de caixa demonstrativo</text><text x="78" y="337" font-size="13" fill="#66818a">Margem e resultado acompanhados no mesmo ecossistema</text><path d="M78 485H638M78 430H638M78 375H638" stroke="#e1eaec"/><path d="M82 468 L145 442 L208 450 L271 405 L334 420 L397 382 L460 390 L523 350 L628 365" fill="none" stroke="#176a78" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g font-size="11" fill="#66818a"><text x="80" y="515">Semana 1</text><text x="270" y="515">Semana 2</text><text x="460" y="515">Semana 3</text><text x="600" y="515">Semana 4</text></g><rect x="700" y="270" width="352" height="270" rx="16" fill="#0d4050"/><text x="732" y="310" font-size="17" font-weight="700" fill="#fff">Conciliação</text><text x="732" y="336" font-size="12" fill="#b9d3d0">O que precisa ser conferido</text><rect x="732" y="365" width="288" height="45" rx="10" fill="#fff" fill-opacity=".1"/><text x="752" y="393" font-size="13" fill="#fff">Vendas × recebimentos</text><text x="956" y="393" font-size="13" fill="#8bc43f">98%</text><rect x="732" y="422" width="288" height="45" rx="10" fill="#fff" fill-opacity=".1"/><text x="752" y="450" font-size="13" fill="#fff">Taxas identificadas</text><text x="956" y="450" font-size="13" fill="#8bc43f">100%</text><text x="732" y="505" font-size="11" fill="#b9d3d0">Dados demonstrativos · ausência de dado não é zero.</text></g></svg>
