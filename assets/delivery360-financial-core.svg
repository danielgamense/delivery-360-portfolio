<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Delivery 360, núcleo financeiro conectado</title><desc id="desc">Demonstração fictícia de DRE, fluxo de caixa, contas, despesas, documentos fiscais, CMV e CMO.</desc>
<rect width="1200" height="760" rx="28" fill="#fff" stroke="#dfe9ea" stroke-width="2"/><rect width="1200" height="96" rx="28" fill="#146a70"/><rect y="68" width="1200" height="28" fill="#146a70"/><text x="52" y="51" font-family="Arial" font-size="26" font-weight="700" fill="#fff">Núcleo financeiro conectado</text><text x="52" y="76" font-family="Arial" font-size="13" fill="#d1e7e3">Fluxo de caixa, DRE completo e custos do restaurante</text><rect x="954" y="30" width="170" height="36" rx="18" fill="#fff" fill-opacity=".13"/><text x="1039" y="53" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Restaurante Modelo</text>
<g font-family="Arial"><rect x="52" y="138" width="250" height="116" rx="16" fill="#eef6f7"/><text x="78" y="174" font-size="13" fill="#66818a">Fluxo de caixa</text><text x="78" y="222" font-size="31" font-weight="700" fill="#123b47">R$ 28,7 mil</text><rect x="326" y="138" width="250" height="116" rx="16" fill="#f0f8f0"/><text x="352" y="174" font-size="13" fill="#66818a">DRE do período</text><text x="352" y="222" font-size="31" font-weight="700" fill="#267450">R$ 12,1 mil</text><rect x="600" y="138" width="250" height="116" rx="16" fill="#fff7ee"/><text x="626" y="174" font-size="13" fill="#66818a">CMV</text><text x="626" y="222" font-size="31" font-weight="700" fill="#c56e33">39,8%</text><rect x="874" y="138" width="274" height="116" rx="16" fill="#f4f4fb"/><text x="900" y="174" font-size="13" fill="#66818a">CMO</text><text x="900" y="222" font-size="31" font-weight="700" fill="#384d79">24,6%</text><rect x="52" y="286" width="530" height="386" rx="18" fill="#f8fafb"/><text x="84" y="326" font-size="19" font-weight="700" fill="#123b47">DRE completo</text><text x="84" y="351" font-size="13" fill="#66818a">Receitas, custos e resultado na mesma leitura</text><g font-size="14"><text x="84" y="397" fill="#315b63">Receita bruta</text><text x="530" y="397" text-anchor="end" fill="#123b47">R$ 146,8 mil</text><text x="84" y="435" fill="#315b63">Taxas e promoções</text><text x="530" y="435" text-anchor="end" fill="#c56e33">- R$ 29,6 mil</text><text x="84" y="473" fill="#315b63">Receita líquida</text><text x="530" y="473" text-anchor="end" fill="#123b47">R$ 117,2 mil</text><text x="84" y="511" fill="#315b63">CMV</text><text x="530" y="511" text-anchor="end" fill="#c56e33">- R$ 46,6 mil</text><text x="84" y="549" fill="#315b63">CMO e despesas</text><text x="530" y="549" text-anchor="end" fill="#c56e33">- R$ 28,8 mil</text><line x1="84" y1="574" x2="530" y2="574" stroke="#dfe9ea"/><text x="84" y="614" font-size="16" font-weight="700" fill="#176a78">Resultado operacional</text><text x="530" y="614" text-anchor="end" font-size="16" font-weight="700" fill="#267450">R$ 12,1 mil</text></g><rect x="610" y="286" width="538" height="386" rx="18" fill="#0d4050"/><text x="644" y="326" font-size="19" font-weight="700" fill="#fff">Controles conectados</text><g font-size="14"><rect x="644" y="360" width="470" height="48" rx="10" fill="#fff" fill-opacity=".1"/><circle cx="670" cy="384" r="7" fill="#8bc43f"/><text x="690" y="389" fill="#fff">Contas a pagar e contas a receber</text><rect x="644" y="424" width="470" height="48" rx="10" fill="#fff" fill-opacity=".1"/><circle cx="670" cy="448" r="7" fill="#6eb7c0"/><text x="690" y="453" fill="#fff">Despesas, notas fiscais e cupons fiscais</text><rect x="644" y="488" width="470" height="48" rx="10" fill="#fff" fill-opacity=".1"/><circle cx="670" cy="512" r="7" fill="#e3a04b"/><text x="690" y="517" fill="#fff">Conciliação bancária e recebimentos</text><rect x="644" y="552" width="470" height="48" rx="10" fill="#fff" fill-opacity=".1"/><circle cx="670" cy="576" r="7" fill="#8bc43f"/><text x="690" y="581" fill="#fff">Estoque, fichas técnicas e CMV</text><text x="644" y="640" font-size="12" fill="#b9d3d0">Sem o dado contratado ou lançado, o cálculo não é inventado.</text></g></g></svg>
