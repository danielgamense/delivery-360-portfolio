<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc"><title id="title">Delivery 360, qualidade da operação</title><desc id="desc">Painel demonstrativo de desempenho operacional e exceções.</desc><rect width="1100" height="610" rx="26" fill="#fff" stroke="#dfe9ea" stroke-width="2"/><text x="48" y="58" font-family="Arial" font-size="25" font-weight="700" fill="#123b47">Qualidade da operação</text><text x="48" y="84" font-family="Arial" font-size="13" fill="#66818a">Entenda onde a experiência do pedido precisa de atenção.</text><g font-family="Arial"><rect x="48" y="120" width="230" height="100" rx="14" fill="#f0f8f0"/><text x="70" y="153" font-size="13" fill="#66818a">Disponibilidade</text><text x="70" y="193" font-size="30" font-weight="700" fill="#267450">97,4%</text><text x="193" y="193" font-size="12" fill="#267450">estável</text><rect x="298" y="120" width="230" height="100" rx="14" fill="#fff7ee"/><text x="320" y="153" font-size="13" fill="#66818a">Cancelamentos</text><text x="320" y="193" font-size="30" font-weight="700" fill="#c56e33">2,8%</text><text x="445" y="193" font-size="12" fill="#c56e33">atenção</text><rect x="548" y="120" width="230" height="100" rx="14" fill="#eef6f7"/><text x="570" y="153" font-size="13" fill="#66818a">Tempo médio</text><text x="570" y="193" font-size="30" font-weight="700" fill="#176a78">31 min</text><text x="701" y="193" font-size="12" fill="#176a78">-4 min</text><rect x="798" y="120" width="254" height="100" rx="14" fill="#f4f4fb"/><text x="820" y="153" font-size="13" fill="#66818a">Pedidos monitorados</text><text x="820" y="193" font-size="30" font-weight="700" fill="#384d79">2.418</text><text x="954" y="193" font-size="12" fill="#384d79">período</text><rect x="48" y="255" width="640" height="300" rx="16" fill="#f8fafb"/><text x="76" y="292" font-size="17" font-weight="700" fill="#123b47">Cancelamentos por motivo</text><text x="76" y="317" font-size="12" fill="#66818a">Distribuição fictícia para priorização</text><g fill="#0d4050"><rect x="78" y="375" width="390" height="24" rx="12"/><rect x="78" y="425" width="250" height="24" rx="12" fill="#1d8290"/><rect x="78" y="475" width="150" height="24" rx="12" fill="#8bc43f"/></g><g font-size="13" fill="#315b63"><text x="78" y="365">Indisponibilidade de item</text><text x="490" y="393">42%</text><text x="78" y="415">Atraso na operação</text><text x="350" y="443">27%</text><text x="78" y="465">Solicitação do cliente</text><text x="250" y="493">16%</text></g><rect x="720" y="255" width="332" height="300" rx="16" fill="#0d4050"/><text x="750" y="294" font-size="17" font-weight="700" fill="#fff">Alertas de operação</text><rect x="750" y="325" width="272" height="56" rx="10" fill="#fff" fill-opacity=".1"/><circle cx="775" cy="353" r="7" fill="#e1a04b"/><text x="794" y="349" font-size="13" fill="#fff">Pico de cancelamentos</text><text x="794" y="368" font-size="11" fill="#b9d3d0">revisar faixa das 19h</text><rect x="750" y="397" width="272" height="56" rx="10" fill="#fff" fill-opacity=".1"/><circle cx="775" cy="425" r="7" fill="#8bc43f"/><text x="794" y="421" font-size="13" fill="#fff">Disponibilidade saudável</text><text x="794" y="440" font-size="11" fill="#b9d3d0">sem ação necessária</text><rect x="750" y="469" width="272" height="56" rx="10" fill="#fff" fill-opacity=".1"/><circle cx="775" cy="497" r="7" fill="#6eb7c0"/><text x="794" y="493" font-size="13" fill="#fff">Tempo em evolução</text><text x="794" y="512" font-size="11" fill="#b9d3d0">melhora no período</text></g></svg>
