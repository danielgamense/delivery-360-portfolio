<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc"><title id="title">Delivery 360, ecossistema de dados</title><desc id="desc">Fluxo demonstrativo de múltiplas lojas, atualização automática e relatórios.</desc><rect width="1100" height="610" rx="26" fill="#fff" stroke="#dfe9ea" stroke-width="2"/><text x="48" y="58" font-family="Arial" font-size="25" font-weight="700" fill="#123b47">Um ecossistema para o restaurante</text><text x="48" y="84" font-family="Arial" font-size="13" fill="#66818a">Dados organizados para quem precisa decidir com clareza.</text><g font-family="Arial"><rect x="48" y="130" width="240" height="180" rx="18" fill="#eef6f7"/><text x="78" y="172" font-size="17" font-weight="700" fill="#123b47">Múltiplas lojas</text><text x="78" y="198" font-size="12" fill="#66818a">Visão consolidada</text><rect x="78" y="225" width="180" height="28" rx="8" fill="#fff"/><circle cx="94" cy="239" r="6" fill="#8bc43f"/><text x="110" y="244" font-size="12" fill="#315b63">Unidade Centro</text><rect x="78" y="263" width="180" height="28" rx="8" fill="#fff"/><circle cx="94" cy="277" r="6" fill="#1d8290"/><text x="110" y="282" font-size="12" fill="#315b63">Unidade Norte</text><path d="M310 220h68" stroke="#8bc43f" stroke-width="4"/><path d="m365 205 20 15-20 15" fill="none" stroke="#8bc43f" stroke-width="4"/><rect x="410" y="130" width="280" height="180" rx="18" fill="#0d4050"/><text x="442" y="172" font-size="17" font-weight="700" fill="#fff">Dados organizados</text><text x="442" y="198" font-size="12" fill="#b9d3d0">Atualização automática</text><circle cx="470" cy="247" r="30" fill="#8bc43f" fill-opacity=".2"/><path d="M455 247l10 10 21-24" fill="none" stroke="#8bc43f" stroke-width="5"/><text x="520" y="244" font-size="13" fill="#fff">Fontes integradas</text><text x="520" y="265" font-size="11" fill="#b9d3d0">tratamento e conferência</text><path d="M712 220h68" stroke="#8bc43f" stroke-width="4"/><path d="m767 205 20 15-20