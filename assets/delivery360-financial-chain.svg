<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Delivery 360, do cupom fiscal ao CMV</title><desc id="desc">Fluxo demonstrativo que conecta documento fiscal, estoque, ficha técnica, CMV e resultado.</desc>
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#123b47" flood-opacity=".12"/></filter></defs><rect width="1200" height="760" rx="28" fill="#f6f9fa"/><rect width="1200" height="96" rx="28" fill="#0d4050"/><rect y="68" width="1200" height="28" fill="#0d4050"/><text x="52" y="51" font-family="Arial" font-size="26" font-weight="700" fill="#fff">Do cupom fiscal ao CMV</text><text x="52" y="76" font-family="Arial" font-size="13" fill="#b9d3d0">Como uma compra vira informação de custo e resultado</text><rect x="945" y="30" width="180" height="36" rx="18" fill="#fff" fill-opacity=".13"/><text x="1035" y="53" text-anchor="middle" font-family="Arial" font-size="12" fill="#fff">Casa Central · exemplo</text>
<g filter="url(#shadow)"><rect x="52" y="138" width="250" height="170" rx="18" fill="#fff"/><rect x="335" y="138" width="250" height="170" rx="18" fill="#fff"/><rect x="618" y="138" width="250" height="170" rx="18" fill="#fff"/><rect x="901" y="138" width="247" height="170" rx="18" fill="#fff"/></g>
<g font-family="Arial"><circle cx="88" cy="176" r="18" fill="#8bc43f"/><text x="88" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><text x="118" y="181" font-size="16" font-weight="700" fill="#123b47">Documento fiscal</text><text x="78" y="220" font-size="13" fill="#66818a">Compra registrada</text><rect x="78" y="238" width="190" height="42" rx="9" fill="#eef6f7"/><text x="94" y="264" font-size="13" fill="#315b63">Cupom · Mercado Modelo</text><circle cx="371" cy="176" r="18" fill="#1d8290"/><text x="371" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text><text x="401" y="181" font-size="16" font-weight="700" fill="#123b47">Itens separados</text><text x="361" y="220" font-size="13" fill="#66818a">Produto, quantidade e imposto</text><rect x="361" y="238" width="190" height="42" rx="9" fill="#eef6f7"/><text x="377" y="264" font-size="13" fill="#315b63">Cebola · 12 kg</text><circle cx="654" cy="176" r="18" fill="#e3a04b"/><text x="654" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text><text x="684" y="181" font-size="16" font-weight="700" fill="#123b47">Estoque e ficha</text><text x="644" y="220" font-size="13" fill="#66818a">Consumo por receita</text><rect x="644" y="238" width="190" height="42" rx="9" fill="#fff7ee"/><text x="660" y="264" font-size="13" fill="#765529">50 g por prato</text><circle cx="937" cy="176" r="18" fill="#176a78"/><text x="937" y="182" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">4</text><text x="967" y="181" font-size="16" font-weight="700" fill="#123b47">CMV atualizado</text><text x="927" y="220" font-size="13" fill="#66818a">Custo real do insumo</text><rect x="927" y="238" width="190" height="42" rx="9" fill="#f0f8f0"/><text x="943" y="264" font-size="13" fill="#267450">R$ 0,42 por prato</text><path d="M308 223h23M591 223h23M874 223h23" stroke="#8bc43f" stroke-width="4"/><path d="m320 211 14 12-14 12M603 211l14 12-14 12M886 211l14 12-14 12" fill="none" stroke="#8bc43f" stroke-width="4"/>
<rect x="52" y="356" width="740" height="320" rx="18" fill="#fff" filter="url(#shadow)"/><text x="84" y="400" font-size="19" font-weight="700" fill="#123b47">Ficha técnica e formação do custo</text><text x="84" y="426" font-size="13" fill="#66818a">A compra não fica isolada. Ela alimenta a receita e o resultado.</text><rect x="84" y="462" width="676" height="52" rx="10" fill="#f7fafb"/><text x="108" y="494" font-size="14" fill="#315b63">Cebola · preço da última compra</text><text x="730" y="494" text-anchor="end" font-size="14" font-weight="700" fill="#123b47">R$ 8,40 / kg</text><rect x="84" y="526" width="676" height="52" rx="10" fill="#f7fafb"/><text x="108" y="558" font-size="14" fill="#315b63">Prato Modelo · consumo calculado</text><text x="730" y="558" text-anchor="end" font-size="14" font-weight="700" fill="#123b47">50 g · R$ 0,42</text><rect x="84" y="590" width="676" height="52" rx="10" fill="#eaf5f3"/><text x="108" y="622" font-size="14" fill="#176a78">Impacto no CMV do período</text><text x="730" y="622" text-anchor="end" font-size="14" font-weight="700" fill="#267450">calculado com os dados disponíveis</text>
<rect x="826" y="356" width="322" height="320" rx="18" fill="#0d4050"/><text x="858" y="400" font-size="19" font-weight="700" fill="#fff">Visão conectada</text><text x="858" y="426" font-size="13" fill="#b9d3d0">O dado aparece onde a decisão acontece.</text><g font-size="14"><text x="858" y="476" fill="#d6e8e4">CMV</text><text x="1110" y="476" text-anchor="end" fill="#8bc43f">39,8%</text><text x="858" y="520" fill="#d6e8e4">Margem</text><text x="1110" y="520" text-anchor="end" fill="#8bc43f">31,2%</text><text x="858" y="564" fill="#d6e8e4">Resultado</text><text x="1110" y="564" text-anchor="end" fill="#fff">R$ 12,1 mil</text></g><rect x="858" y="600" width="230" height="42" rx="10" fill="#fff" fill-opacity=".12"/><text x="973" y="626" text-anchor="middle" font-size="12" fill="#fff">Dados demonstrativos</text></g></svg>
