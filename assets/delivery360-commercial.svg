<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc"><title id="title">Delivery 360, análise comercial</title><desc id="desc">Painel demonstrativo de produtos, cardápio e comparativos.</desc><rect width="1100" height="610" rx="26" fill="#fff" stroke="#dfe9ea" stroke-width="2"/><text x="48" y="58" font-family="Arial" font-size="25" font-weight="700" fill="#123b47">Produtos e cardápio</text><text x="48" y="84" font-family="Arial" font-size="13" fill="#66818a">Transforme o mix de vendas em decisões comerciais.</text><g font-family="Arial"><rect x="48" y="120" width="500" height="415" rx="16" fill="#f7fafb"/><text x="76" y="158" font-size="17" font-weight="700" fill="#123b47">Categorias com maior participação</text><text x="76" y="183" font-size="12" fill="#66818a">Participação no faturamento demonstrativo</text><text x="76" y="238" font-size="13" fill="#315b63">Lanches</text><rect x="170" y="222" width="300" height="20" rx="10" fill="#0d4050"/><text x="485" y="238" font-size="13" fill="#315b63">38%</text><text x="76" y="288" font-size="13" fill="#315b63">Bebidas</text><rect x="170" y="272" width="237" height="20" rx="10" fill="#1d8290"/><text x="422" y="288" font-size="13" fill="#315b63">30%</text><text x="76" y="338" font-size="13" fill="#315b63">Combos</text><rect x="170" y="322" width="174" height="20" rx="10" fill="#8bc43f"/><text x="359" y="338" font-size="13" fill="#315b63">22%</text><text x="76" y="388" font-size="13" fill="#315b63">Sobremesas</text><rect x="170" y="372" width="80" height="20" rx="10" fill="#e3a04b"/><text x="265" y="388" font-size="13" fill="#315b63">10%</text><rect x="76" y="438" width="426" height="58" rx="12" fill="#eaf5f3"/><text x="96" y="465" font-size="13" fill="#176a78">Oportunidade</text><text x="96" y="483" font-size="12" fill="#315b63">Combos cresceram 8,2% no período.</text><rect x="578" y="120" width="474" height="200" rx="16" fill="#0d4050"/><text x="608" y="160" font-size="17" font-weight="700" fill="#fff">Comparativo de períodos</text><text x="608" y="185" font-size="12" fill="#b9d3d0">Período atual × período anterior</text><text x="608" y="235" font-size="14" fill="#d6e8e4">Faturamento</text><text x="850" y="235" font-size="14" fill="#8bc43f">+12,8%</text><text x="608" y="270" font-size="14" fill="#d6e8e4">Ticket médio</text><text x="850" y="270" font-size="14" fill="#8bc43f">+4,1%</text><rect x="578" y="350" width="474" height="185" rx="16" fill="#f7fafb"/><text x="608" y="390" font-size="17" font-weight="700" fill="#123b47">Produtos em destaque</text><g><rect x="608" y="415" width="120" height="78" rx="12" fill="#eaf5f3"/><text x="668" y="449" text-anchor="middle" font-size="24" fill="#176a78">01</text><text x="668" y="477" text-anchor="middle" font-size="12" fill="#315b63">Combo Modelo</text><rect x="748" y="415" width="120" height="78" rx="12" fill="#eef5e8"/><text x="808" y="449" text-anchor="middle" font-size="24" fill="#5e8b30">02</text><text x="808" y="477" text-anchor="middle" font-size="12" fill="#315b63">Lanche Especial</text><rect x="888" y="415" width="120" height="78" rx="12" fill="#fff4e9"/><text x="948" y="449" text-anchor="middle" font-size="24" fill="#c57439">03</text><text x="948" y="477" text-anchor="middle" font-size="12" fill="#315b63">Bebida da Casa</text></g></g></svg>
